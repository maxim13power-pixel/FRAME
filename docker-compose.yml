version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: frame_postgres
    restart: always
    environment:
      POSTGRES_USER: frame_user
      POSTGRES_PASSWORD: frame_pass
      POSTGRES_DB: frame_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: