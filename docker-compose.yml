version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: frame_postgres
    restart: always
    environment:
      POSTGRES_USER: frame_user
      POSTGRES_PASSWORD: frame_pass
      POSTGRES_DB: frame_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frame_user -d frame_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: